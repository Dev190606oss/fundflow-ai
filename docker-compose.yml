version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fundflow-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fundflow_ai
    ports:
      - "5432:5432"
    volumes:
      - fundflow_pgdata:/var/lib/postgresql/data

volumes:
  fundflow_pgdata:
